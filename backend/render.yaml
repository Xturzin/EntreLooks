# Referencia do que esta configurado no painel do Render, nao fonte da verdade.
#
# ATENCAO: este arquivo NAO esta sendo aplicado como Blueprint hoje. Blueprint exige o
# render.yaml na RAIZ do repositorio, e este esta em backend/. O servico foi criado a mao
# pelo painel, e e la que os valores valem de verdade.
#
# Entao pra que ele existe: pra nao ter informacao de infra que so mora dentro de um painel
# web. Se a conta do Render sumir ou alguem precisar recriar o servico, esta aqui o que
# estava configurado. Mudou algo no painel, atualize aqui junto.
#
# O PYTHON_VERSION abaixo espelha o painel. Trocar a versao de Python EM PRODUCAO e no
# painel; mudar so este arquivo nao surte efeito nenhum enquanto ele nao for Blueprint.

services:
  - type: web
    name: entrelooks-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 3.13 e o teto hoje, e quem manda nele e o Pillow 10.4. O que prendia em 3.12 era o
      # onnxruntime, que saiu junto com o recorte de fundo no servidor. O porque completo
      # esta no backend/requirements.txt.
      #
      # ATENCAO a ordem: este arquivo nao e Blueprint, entao mudar aqui nao muda nada. A
      # troca de verdade e no painel do Render, e ela so pode acontecer DEPOIS que o
      # requirements.txt sem onnxruntime estiver publicado. Ao contrario, o build quebra.
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false