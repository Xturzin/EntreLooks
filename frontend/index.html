   <link rel="manifest" href="/manifest.json">

   <!-- favicon -->

   <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">

   <!-- Apple / iOS -->

   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="default">
   <meta name="apple-mobile-web-app-title" content="EntreLooks">
   <!-- O iOS ignora o manifest.json e nao aceita SVG aqui, entao o icone da tela de
        inicio dele tem que ser este PNG. Se apontar pro SVG, o iPhone desiste e usa um
        print da tela como icone. -->
   <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

   <!-- Open Graph -->
   <meta property="og:type" content="website">
   <meta property="og:title" content="EntreLooks - Seu guarda-roupa inteligente">
   <meta property="og:description" content="Organize suas roupas e receba looks completos criados por IA.">
   <meta property="og:site_name" content="EntreLooks">

   <!-- Twitter Card -->
   <meta name="twitter:card" content="summary">
   <meta name="twitter:title" content="EntreLooks">
   <meta name="twitter:description" content="Seu guarda-roupa inteligente com IA.">
   <!-- Fontes da marca. Elas moravam num @import dentro do variables.css, e ali o
        navegador só descobria que existiam depois de baixar e ler aquele arquivo, o que
        punha três idas à rede em fila. Aqui ele enxerga tudo já na primeira leitura do
        HTML e busca em paralelo com o CSS do app.

        Os dois preconnect abrem a conexão antes de ela ser pedida: um para o CSS das
        fontes e outro para os arquivos .woff2, que vêm de um domínio diferente. O
        crossorigin do segundo não é enfeite. Arquivo de fonte é sempre buscado em modo
        CORS anônimo, e sem o atributo o preconnect abriria uma conexão de tipo diferente
        da que vai ser usada de verdade, então ela seria descartada e o navegador
        precisaria abrir outra do zero, que é justamente o que se quer evitar.

        O display=swap continua na URL: é ele que faz o texto aparecer na fonte do
        sistema enquanto a definitiva não chega, em vez de deixar a tela sem texto. -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;display=swap">

   <!-- Registro do service worker. Fica inline aqui, e nao num arquivo dentro de js/,
        porque ele nao pode depender de nada do app: se qualquer coisa nesse bloco
        falhar, o site tem que continuar de pe exatamente como era antes de existir PWA. -->
   <script>
      if ('serviceWorker' in navigator) {
         // Se ja existe um service worker no comando, esta pagina foi aberta por uma
         // instalacao anterior. Ler isso ANTES de registrar e o que permite separar
         // "trocou de versao" de "acabou de instalar pela primeira vez".
         const jaTinhaControlador = !!navigator.serviceWorker.controller
         let recarregando = false

         // Quando a versao nova assume, a pagina em pe ainda e a antiga, entao um reload
         // deixa a pessoa na versao certa sem ela precisar fazer nada. So que na
         // primeirissima visita esse evento tambem dispara, e recarregar ali seria um
         // susto sem motivo, porque o conteudo e exatamente o mesmo que ja esta na tela.
         navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!jaTinhaControlador || recarregando) return
            recarregando = true
            window.location.reload()
         })

         // Espera o load pra nao disputar rede com o CSS e o JS da primeira pintura.
         window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((registro) => {
               // App instalado fica dias aberto em segundo plano no celular, entao
               // checar atualizacao so no carregamento da pagina pode nunca acontecer.
               // Aqui a gente pergunta de novo quando ele volta pro primeiro plano, com
               // uma folga de uma hora pra nao pedir a cada troca de aba.
               const FOLGA_ENTRE_CHECAGENS = 60 * 60 * 1000
               let ultimaChecagem = Date.now()

               document.addEventListener('visibilitychange', () => {
                  if (document.visibilityState !== 'visible') return
                  if (Date.now() - ultimaChecagem < FOLGA_ENTRE_CHECAGENS) return
                  ultimaChecagem = Date.now()
                  registro.update().catch(() => {})
               })
            }).catch((erro) => {
               // Sem service worker a pessoa perde o offline e a instalacao, mas o site
               // segue funcionando igual. Por isso isto e um aviso, nao um erro.
               console.warn('Service worker nao registrado:', erro)
            })
         })
      }
   </script>
</body>
</html>
